plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.4'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'nu.studer.jooq' version '9.0'
    id 'com.github.node-gradle.node' version '5.0.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	runtimeOnly 'org.postgresql:postgresql'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.seleniumhq.selenium:selenium-java:4.15.0'

	jooqGenerator 'org.postgresql:postgresql'
}

jooq {
	version = '3.18.13'
	def jooqDbUrl = System.getenv('JOOQ_DB_URL') ?: 'jdbc:postgresql://localhost:5432/laba4'
	def jooqDbUser = System.getenv('JOOQ_DB_USER') ?: 'postgres'
	def jooqDbPassword = System.getenv('JOOQ_DB_PASSWORD') ?: '123'

	configurations {
		main {
			generationTool {

				jdbc {
					driver = 'org.postgresql.Driver'
					url = jooqDbUrl
					user = jooqDbUser
					password = jooqDbPassword
				}

				generator {
					name = 'org.jooq.codegen.DefaultGenerator'

					database {
						name = 'org.jooq.meta.postgres.PostgresDatabase'
						inputSchema = 'public'
						includes = '.*'
					}

					generate {
						pojos = true
						records = true
						daos = true
						generatedAnnotationDate = false

					}
					target {
						packageName = 'com.example.laba4.db'
						directory = 'build/generated-src/jooq/main'
					}
				}
			}
		}
	}
}

sourceSets {
	main {
		java {
			srcDirs += 'build/generated-src/jooq/main'
		}
	}
}

def compileJavaSource(File inputDir, File outputDir, FileCollection classpath,
                      List<File> additionalSourceDirs = []) {

	def javaFiles = fileTree(inputDir).matching { include '**/*.java' }
			.files.collect { it.absolutePath }

	for (File additionalDir : additionalSourceDirs) {
		if (additionalDir.exists()) {
			javaFiles.addAll(fileTree(additionalDir).matching { include '**/*.java' }
					.files.collect { it.absolutePath })
		}
	}

	outputDir.mkdirs()

	def cmdLine = ['javac', '-d', outputDir.absolutePath, '-cp', classpath.asPath] + javaFiles

	println "Compiling ${javaFiles.size()} Java files to ${outputDir.absolutePath}"

	exec {
		commandLine = cmdLine
	}
}

tasks.named('compileJava') {
	dependsOn tasks.named('generateJooq')
}

springBoot {
	mainClass = 'com.example.laba4.Laba4Application'
}

tasks.named('generateJooq') {
    inputs.file('src/main/resources/init.sql')
    allInputsDeclared = true
    outputs.dir('build/generated-src/jooq/main/com/example/laba4/db')
}

tasks.register('compile') {
	group = 'build'
	description = 'Compile Java source files'
	dependsOn tasks.named('generateJooq')

	doLast {
		def srcDir = file('src/main/java')
		def genSrcDir = file('build/generated-src/jooq/main')
		def outDir = file('build/classes/java/main')
		def classpath = sourceSets.main.compileClasspath

		compileJavaSource(srcDir, outDir, classpath, [genSrcDir])
	}
}

tasks.register('myClean') {
    group = 'custom'
    description = 'Deletes build dir.'
    outputs.upToDateWhen {
        !file('build').exists()
    }
    doLast {
        delete 'build'
    }
}

tasks.register('startFront'){
	group = 'custom'
	description = 'start frontend by npm'
	doLast {
		exec {
			workingDir = file('frontend')
			commandLine = ['cmd', '/c', 'ng', 'serve', '--host', '0.0.0.0', '--port', '4200']

		}
	}
}

tasks.register('killFront'){
	group = 'custom'
	description = 'kill front process'
	doLast{
		exec{
			commandLine = ['cmd', '/c', 'netstat', '-ano', '|', 'findstr', ':4200', '>', 'tmp.txt']
		}
		exec{
			def fileOut = file('tmp.txt')
			String s = fileOut.text
			def tmp = s.split()[-1]
			println(tmp)
			commandLine = ['cmd', '/c', 'taskkill', '/PID', tmp, '/F']
			delete 'tmp.txt'
		}
	}
}



tasks.register('music') {
	group = 'custom'
	doLast {
		try {
			if (!java.awt.Desktop.isDesktopSupported()) return
			def musicFile = rootProject.file('lowcortizol.mp3')
			java.awt.Desktop.getDesktop().open(musicFile)
		} catch (Exception e) {
		}
	}
}

tasks.named('bootJar') {
	archiveFileName = 'laba4.jar'
}

tasks.named('build') {
	dependsOn tasks.named('test')
	finalizedBy(tasks.named('music'))
}

tasks.named('test') {
	useJunitPlatform{
		includeTags 'unit'
	}
	outputs.upToDateWhen {false}
	reports {
		html.required = false;
		junitXml.required = true;
	}
}

tasks.register('functionalTest', Test) {
	group = 'verification'
	description = 'Runs Selenium functional tests'
	useJUnitPlatform {
		includeTags 'functional'
	}
	outputs.upToDateWhen { false }
	reports {
		html.required = false
		junitXml.required = true
	}
	systemProperty 'selenium.headless', System.getProperty('selenium.headlessв')
}

tasks.register('report') {
    group = 'verification'
    description = 'Make tests and then add to git'
    dependsOn tasks.named('test')

    doLast {
        def testResultsDir = file("$buildDir/test-results/test")

        if (!testResultsDir.exists()) {
            throw new GradleException("Test results directory not found: $testResultsDir")
        }

       try {
            exec {
                commandLine 'git', 'add', testResultsDir.absolutePath
            }

            exec {
                commandLine 'git', 'commit', '-m', 'Add test report'
            }

            logger.lifecycle("Test results committed to git (or git not available)")
        } catch (Exception e) {
            logger.warn("Could not commit test results to git: ${e.message}")
        }
    }
}



