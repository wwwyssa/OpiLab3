plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.4'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'nu.studer.jooq' version '9.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	runtimeOnly 'org.postgresql:postgresql'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	jooqGenerator 'org.postgresql:postgresql'
}

jooq {
	version = '3.18.7'

	configurations {
		main {
			generationTool {

				jdbc {
					driver = 'org.postgresql.Driver'
					url = 'jdbc:postgresql://localhost:5432/laba4'
					user = 'postgres'
					password = '123'
				}

				generator {
					name = 'org.jooq.codegen.DefaultGenerator'

					database {
						name = 'org.jooq.meta.postgres.PostgresDatabase'
						inputSchema = 'public'
						includes = '.*'
					}

					generate {
						pojos = true
						records = true
						daos = true
					}

					target {
						packageName = 'com.example.laba4.db'
						directory = 'build/generated-src/jooq/main'
					}
				}
			}
		}
	}
}

sourceSets {
	main {
		java {
			srcDirs += 'build/generated-src/jooq/main'
		}
	}
}

springBoot {
	mainClass = 'com.example.laba4.Laba4Application'
}


tasks.register('compile') {
	group = 'build'
	dependsOn tasks.named('compileJava')
}


tasks.register('music') {
	group = 'custom'
	doLast {
		try {
			if (!java.awt.Desktop.isDesktopSupported()) return
			def musicFile = rootProject.file('merin.mp3')
			if (!musicFile.exists()) return
			java.awt.Desktop.getDesktop().open(musicFile)
		} catch (Exception e) {
			
		}
	}
}

tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

tasks.named('build') {
	finalizedBy(tasks.named('music'))
}

tasks.named('test') {
	useJUnitPlatform {
		includeTags 'unit'
	}
	reports {
        html.required = false
        junitXml.required = true
    }
}

tasks.register('report') {
    group = 'verification'
    description = 'Make tests and then add ti git'
    dependsOn tasks.named('test')

    doLast {
        def testResultsDir = file("$buildDir/test-results/test")

        if (!testResultsDir.exists()) {
            throw new GradleException("Test results directory not found: $testResultsDir")
        }

        exec {
            commandLine 'git', 'add', testResultsDir.absolutePath
        }

        exec {
            commandLine 'git', 'commit', '-m', 'Add test report'
        }
    }
}